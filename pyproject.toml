[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budge"
dynamic = ["version"]
description = "Glue around hledger, SimpleFIN, and Paisa: fetch, categorize, review, plan, consult, talk."
requires-python = ">=3.9"
# Zero runtime dependencies by design: stdlib only.

[project.urls]
Repository = "https://github.com/longestmt/budge"

[project.scripts]
budge = "budge.cli:main"

[tool.setuptools]
packages = ["budge", "budge.systemd"]

[tool.setuptools.dynamic]
version = {attr = "budge.__version__"}

[tool.setuptools.package-data]
budge = ["systemd/*.in"]

[tool.setuptools.data-files]
"share/man/man1" = ["budge.1"]
